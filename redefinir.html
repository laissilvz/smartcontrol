<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/redefinir.css">

    <title>Redefinir Senha</title>
</head>

<body>

    <header>

        <div class="logo">
            💡
        </div>

        <h1>Redefinir senha</h1>

        <button class="menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>

    <main>

        <div class="senha-box">

            <form>

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail..."
                    required
                >

                <label for="nova-senha">Nova senha</label>

                <input
                    type="password"
                    id="nova-senha"
                    placeholder="Digite sua nova senha..."
                    required
                >

                <label for="confirmar-senha">Confirmar senha</label>

                <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Confirme sua nova senha..."
                    required
                >

                <button
                    type="submit"
                    class="btn-redefinir"
                >
                    Redefinir senha
                </button>

            </form>

            <a
                href="index.html"
                class="voltar"
            >
                Voltar para o login
            </a>

        </div>

    </main>

</body>
</html>
