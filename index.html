<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>HTML5 - Parte 1 - Login</title>
</head>

<body>

    <header>
        <h1>Tela de Login</h1>
    </header>

    <main>
        
        <form method="get" action="dashboard.html">

            <label for="email">E-mail:</label>
            <input
                type="email"
                name="email"
                id="email"
                placeholder="Digite seu e-mail..."
                required
            >

            <br><br>

            <label for="senha">Senha:</label>
            <input
                type="password"
                name="senha"
                id="senha"
                placeholder="Digite sua senha..."
                required
            >

            <br><br>

            <a href="criar-conta.html">Criar conta</a>
            <a href="esqueci-senha.html">Esqueci minha senha</a>

            <button type="submit">Entrar</button>

        </form>

    </main>

</body>
</html>
