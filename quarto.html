<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarto Principal - Dashboard</title>
    <link rel="stylesheet" href="assets/css/menu.css">
    <link rel="stylesheet" href="assets/css/quarto.css">
</head>

<body>

    <!-- FUNDO ESCURO DO MENU -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- MENU PRINCIPAL -->
    <div class="side-menu" id="sideMenu">

        <button class="close-menu" id="closeMenu" type="button">
            ✕
        </button>

        <h2>Menu</h2>

        <button class="menu-option" id="escolherComodo" type="button">
            Escolher cômodo
        </button>

        <button class="menu-option" type="button">
            Gerenciar dispositivos
        </button>

        <button class="menu-option" type="button">
            Desconectar-se
        </button>

    </div>

    <!-- MENU DE CÔMODOS -->
    <div class="room-menu" id="roomMenu">

        <button class="close-menu" id="closeRoomMenu" type="button">
            ✕
        </button>

        <h2>Escolher cômodo</h2>

        <button class="room-option" type="button"
            onclick="window.location.href='quarto.html'">
            Quarto<br>
            Principal
        </button>

        <button class="room-option" type="button"
            onclick="window.location.href='sala.html'">
            Sala
        </button>

        <button class="room-option" type="button"
            onclick="window.location.href='cozinha.html'">
            Cozinha
        </button>

        <button class="room-option" type="button"
            onclick="window.location.href='dashboard.html'">
            Dashboard<br>
            Geral
        </button>

    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">

        <!-- CABEÇALHO -->
        <header class="header">

            <div class="header-left">

                <div class="lampada">
                    💡
                </div>

                <h1>Dashboard</h1>

            </div>

            <div class="header-right">

                <span>Quarto Principal -</span>

                <!-- BOTÃO HAMBÚRGUER -->
                <button class="menu-button" type="button" onclick="abrirMenu()">
                    <i></i>
                    <i></i>
                    <i></i>
                </button>

            </div>

        </header>

        <!-- ÁREA PRINCIPAL -->
        <main class="main">

            <!-- LADO ESQUERDO -->
            <section class="left-panel">

                <h2>Aparelhos do comodo -</h2>

                <div class="devices">

                    <button class="device">
                        TV QLD SAMSUNG
                    </button>

                    <button class="device">
                        Ar condicionado
                    </button>

                    <button class="device">
                        Persiana
                    </button>

                    <button class="device">
                        Luz do teto
                    </button>

                </div>

            </section>

            <!-- LADO DIREITO -->
            <section class="right-panel">

                <h2>
                    Dados de Uso - Ar condicionado
                </h2>

                <div class="charts">

                    <!-- CONSUMO DE ENERGIA -->
                    <div class="chart-box pie-box">

                        <div class="chart-title">
                            Consumo<br>
                            de energia
                        </div>

                        <div class="pie-chart"></div>

                        <div class="legend">

                            <span>
                                <b class="green"></b>
                                Usuário 1
                            </span>

                            <span>
                                <b class="yellow"></b>
                                Usuário 2
                            </span>

                            <span>
                                <b class="cyan"></b>
                                Usuário 3
                            </span>

                        </div>

                    </div>

                    <!-- HORÁRIO DE PICO -->
                    <div class="chart-box bar-box">

                        <div class="chart-title">
                            Horário de pico de<br>
                            uso
                        </div>

                        <div class="bars">

                            <div class="bar-container">
                                <div class="bar bar-1"></div>
                                <span>Usuário 1</span>
                            </div>

                            <div class="bar-container">
                                <div class="bar bar-2"></div>
                                <span>Usuário 2</span>
                            </div>

                            <div class="bar-container">
                                <div class="bar bar-3"></div>
                                <span>Usuário 3</span>
                            </div>

                        </div>

                    </div>

                    <!-- TEMPO DE USO -->
                    <div class="chart-box bar-box time-box">

                        <div class="chart-title">
                            Tempo de Uso
                        </div>

                        <div class="bars">

                            <div class="bar-container">
                                <div class="bar bar-4"></div>
                                <span>Usuário 1</span>
                            </div>

                            <div class="bar-container">
                                <div class="bar bar-5"></div>
                                <span>Usuário 2</span>
                            </div>

                            <div class="bar-container">
                                <div class="bar bar-6"></div>
                                <span>Usuário 3</span>
                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- JAVASCRIPT DO MENU -->
    <script src="js/menu.js"></script>

</body>

</html>
