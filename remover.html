<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Remover Dispositivo</title>

    <link rel="stylesheet" href="assets/css/remover.css">
    <link rel="stylesheet" href="assets/css/menu.css">
</head>

<body>

    <header class="topo">

        <div class="logo">

            <div class="lampada">
                💡
            </div>

            <span>
                Gerenciar Dispositivos
            </span>

        </div>


        <button
            id="menuBtn"
            class="menu-btn"
            type="button"
            onclick="abrirMenu()">
            ☰
        </button>

    </header>


    <!-- FUNDO DO MENU -->

    <div
        id="menuOverlay"
        class="menu-overlay">
    </div>


    <!-- MENU PRINCIPAL -->

    <aside
        id="sideMenu"
        class="side-menu">

        <button
            id="closeMenu"
            type="button">
            ✕
        </button>


        <h2>
            Menu
        </h2>


        <button
            id="escolherComodo"
            type="button">
            Escolher cômodo
        </button>


        <button
            type="button"
            onclick="window.location.href='gerenciar.html'">
            Gerenciar dispositivos
        </button>


        <button
            type="button"
            onclick="window.location.href='index.html'">
            Desconectar-se
        </button>

    </aside>


    <!-- MENU DE CÔMODOS -->

    <aside
        id="roomMenu"
        class="room-menu">

        <button
            id="closeRoomMenu"
            type="button">
            ✕
        </button>


        <h2>
            Escolher cômodo
        </h2>


        <button
            type="button"
            onclick="window.location.href='quarto.html'">
            Quarto Principal
        </button>


        <button
            type="button"
            onclick="window.location.href='sala.html'">
            Sala
        </button>


        <button
            type="button"
            onclick="window.location.href='cozinha.html'">
            Cozinha
        </button>

    </aside>


    <!-- CONTEÚDO -->

    <main class="conteudo">

        <div class="card-form">

            <form
                id="formRemover"
                action="gerenciar.html">

                <label for="nome">
                    Nome do Dispositivo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Enter..."
                    required
                >


                <label for="comodo">
                    Cômodo do dispositivo
                </label>

                <input
                    type="text"
                    id="comodo"
                    name="comodo"
                    placeholder="Enter..."
                    required
                >


                <button
                    type="submit"
                    class="btn remover">
                    Remover<br>
                    dispositivo
                </button>

            </form>

        </div>

    </main>


    <script src="js/menu.js"></script>

</body>

</html>
